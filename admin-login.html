<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理員登入｜WUGONG 吾鋼</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body data-page="login"><header><a href="/">WUGONG 吾鋼</a></header><main class="login"><p class="eyebrow">商店管理</p><h1>管理員登入</h1><p>請使用已授權的會員帳號與密碼登入。</p><form id="login" class="card"><label for="email">電子郵件</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button type="submit">登入後台</button><p id="message" role="status" aria-live="polite"></p></form><p>一般會員帳號需經商店擁有人授權，才能使用後台。</p><a href="/member.html">會員登入與密碼重設</a></main></body></html>
