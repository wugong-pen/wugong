# Default deployment is always the isolated test site.
name = "wugong-test"
main = "worker.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_ENV = "staging"
BANK_TEST_CONFIG = '{"bank":"測試銀行（請勿匯款）","code":"TEST","branch":"測試分行","holder":"測試戶名","account":"TEST-NOT-A-REAL-ACCOUNT","days":3}'
PAYMENT_ORIGIN = "https://wugong-test.wugong-pen.workers.dev"
MAIL_FROM = "WUGONG <noreply@mail.wugong-pen.com>"
MAIL_ORIGIN = "https://wugong-test.wugong-pen.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "wugong-orders-test"
database_id = "0ec61e02-9f1a-4d7f-a4a5-7950934443bf"

# Only deploy after approval of the tested commit.
[env.production]
name = "wugong"

[env.production.assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

[env.production.vars]
APP_ENV = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "wugong-orders"
database_id = "dd1346b0-8c57-491c-a730-49ff2d73855c"
