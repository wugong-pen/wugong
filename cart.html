<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車｜WUGONG 吾鋼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #111;
      color: #eee;
    }

    header {
      padding: 24px 30px;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #d6b16f;
      text-decoration: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 24px 80px;
    }

    .eyebrow {
      color: #b9975b;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 40px;
      font-size: 32px;
      font-weight: 500;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 22px;
      align-items: center;
      padding: 22px 0;
      border-bottom: 1px solid #2b2b2b;
    }

    .cart-item img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      background: #1b1b1b;
    }

    .item-name {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .item-nib {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .item-price {
      color: #d6b16f;
      margin-bottom: 14px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-row button {
      width: 32px;
      height: 32px;
      background: transparent;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }

    .qty-value {
      min-width: 30px;
      text-align: center;
    }

    .remove-btn {
      margin-top: 12px;
      background: none;
      border: none;
      color: #888;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }

    .item-subtotal {
      font-size: 18px;
      white-space: nowrap;
    }

    .summary {
      margin-top: 40px;
      margin-left: auto;
      max-width: 420px;
      border-top: 1px solid #444;
      padding-top: 25px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .total {
      font-size: 22px;
      color: #d6b16f;
      padding-top: 16px;
      border-top: 1px solid #333;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      background: #b9975b;
      color: #111;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      opacity: 0.9;
    }

    .empty-cart {
      padding: 70px 0;
      text-align: center;
      color: #aaa;
    }

    .empty-cart a {
      color: #d6b16f;
    }

    @media (max-width: 700px) {
      .cart-item {
        grid-template-columns: 90px 1fr;
      }

      .cart-item img {
        width: 90px;
        height: 90px;
      }

      .item-subtotal {
        grid-column: 2;
      }
    }
  </style>
<link rel="stylesheet" href="/responsive.css">
</head>

<body>

<header>
  <a href="index.html">WUGONG 吾鋼</a>
  <a href="/shop.html">繼續購物</a>
<a href="/member.html" style="color:#d6b16f">會員中心</a></header>

<main class="container">

  <div class="eyebrow">SHOPPING CART</div>
  <h1>購物車</h1>

  <div id="cartItems"></div>

  <div class="summary" id="cartSummary" style="display:none;">

    <div class="summary-row">
      <span>商品總額</span>
      <span id="subtotal">NT$0</span>
    </div>

    <div class="summary-row total">
      <span>合計</span>
      <span id="total">NT$0</span>
    </div>

    <button class="checkout-btn" id="checkoutButton">
      前往結帳
    </button>

  </div>

</main>

<script type="module" src="/cart-safe.js"></script>

</body>
</html>
