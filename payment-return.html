<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>付款確認｜WUGONG</title><link rel="stylesheet" href="member.css"><link rel="stylesheet" href="/i18n.css"><script type="module" src="/i18n.js"></script></head>
<body><main style="max-width:680px;margin:40px auto;padding:24px"><h1>付款確認</h1><p>請核對訂單付款狀態；已付款時請勿重複支付。</p><p id="message" role="status">正在讀取訂單…</p><section id="bank" hidden><h2>銀行匯款資料</h2><dl id="details"></dl><form id="report"><label>匯款帳號末五碼<input id="last5" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required></label><label>匯款日期<input id="date" type="date" required></label><button type="submit">回報已匯款</button></form><p>回報後仍須人工核對入帳，不會自動視為已付款。</p></section><button id="continue" hidden>繼續付款</button><p><a href="/member.html">返回購買紀錄</a></p></main><script type="module" src="payment-return.js"></script></body></html>
